<style>

</style>

<script>
(function(){
'use strict';
var KEY='spend.v2';
var EC=['Groceries','Eating out','Transport','Rent','Bills','Mobile & net','Education','Health','Shopping','Fun','Trips','Family','Zakat, Pujo & donation','Other'];
var IC=['Salary','Business','Gift','Other'];
var PAY=['Cash','bKash','Nagad','Rocket','Bank','Card'];
var IK=['DPS','FDR','Sanchayapatra','Stocks (DSE)','Gold','Crypto','Business','Other'];
var EM={'Groceries':'🛒','Eating out':'🍽️','Transport':'🚌','Rent':'🏠','Bills':'💡','Mobile & net':'📶','Education':'🎓','Health':'💊','Shopping':'🛍️','Fun':'🎬','Trips':'✈️','Family':'👪','Zakat, Pujo & donation':'🤲','Other':'📦'};
var PAL=[['sky','#b6cff7','Sky'],['mint','#b8e6d0','Mint'],['lav','#d5c8f2','Lavender'],['sand','#f0dfbb','Sand'],['rose','#f5c9d3','Rose'],['plain','#d1d1d6','Plain']];
var S={tx:[],loans:[],inv:[],cur:'BDT',rate:123,bn:false,bud:{},wants:['Eating out','Shopping','Fun']};
var tab='home',lt='loans',F={},SF=function(){},mon,wk,tv=null;
var $=function(i){return document.getElementById(i)};
var p2=function(n){return n<10?'0'+n:''+n};
var ds=function(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
var pd=function(s){return new Date(s+'T00:00:00')};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
function ws(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+1)%7));return x}
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var BD='০১২৩৪৫৬৭৮৯';
function dg(s){return S.bn?String(s).replace(/[0-9]/g,function(d){return BD[d]}):s}
function num(s){var x=parseFloat(String(s).replace(/[০-৯]/g,function(d){return BD.indexOf(d)}).replace(/,/g,''));return isFinite(x)?x:NaN}
var SYM={BDT:'৳',USD:'$',INR:'₹'};
function fm(n,c){c=c||S.cur;var d=(c!=='BDT'&&R(c)>=5)?2:0,y=(S.sym&&S.sym[c])||SYM[c]||c;return dg(y+(y.length>1?' ':'')+Math.abs(n).toLocaleString(c==='BDT'||c==='INR'?'en-IN':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d}))}
var R=function(c){return c==='BDT'||!S.fx?1:(S.fx[c]||1)};
var B=function(x){return x.amt*R(x.cur)};
var cv=function(b){return b/R(S.cur)};
var fb=function(b){return fm(cv(b))};
var sum=function(a){return a.reduce(function(s,t){return s+B(t)},0)};
var fd=function(s){return dg(pd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}))};
var tdy=function(){return ds(new Date())};
var toastT;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2400)}

function load(){try{var r=localStorage.getItem(KEY);if(r){Object.assign(S,JSON.parse(r));return}
r=localStorage.getItem('spend.v1');if(r){var o=JSON.parse(r);S.tx=(o.expenses||[]).map(function(e){return Object.assign({type:'exp',pay:'Cash'},e)});S.cur=o.cur==='USD'?'USD':'BDT';S.rate=+o.rate>0?+o.rate:120}}catch(e){}}
function applyTheme(){var r=document.documentElement,t=S.theme||'auto';
  if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
  var c=S.pal==='custom'&&S.tint?S.tint:(PAL.filter(function(x){return x[0]===(S.pal||'sky')})[0]||PAL[0])[1];
  r.style.setProperty('--tint',c)}
function fxFix(){S.fx=Object.assign({USD:S.rate>0?S.rate:123,INR:1.31},S.fx||{});S.sym=Object.assign({BDT:'৳',USD:'$',INR:'₹'},S.sym||{});S.cc=S.cc||{code:'INR'};if(!S.fx[S.cc.code])S.fx[S.cc.code]=1;S.trips=S.trips||[];S.cloud=S.cloud||{};if(!S.cloud.pid)S.cloud.pid='spend-tracker-git';if(!S.cloud.key)S.cloud.key='AIzaSyDMB5kyVEowBB8D7sTV9iJGyCA2mzBj_P8';var Z='Zakat & donation',N='Zakat, Pujo & donation';S.tx.forEach(function(t){if(t.cat===Z)t.cat=N});if(S.bud[Z]){S.bud[N]=S.bud[Z];delete S.bud[Z]}S.wants=S.wants.map(function(w){return w===Z?N:w})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save. Storage may be full.')}}

/* helpers for markup */
function seg(g,o,v,cls,act){if(g==='cur'&&o.length<3){var cc=S.cc.code,sy=S.sym[cc]||cc;o=o.concat([[cc,o[0][1].length>2?sy+' '+cc:sy]])};return '<div class="seg '+(cls||'')+'">'+o.map(function(x){return '<button class="'+(x[0]===v?'on':'')+'" data-a="'+(act||'seg')+'" data-g="'+g+'" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'}
function chip(g,v,cur,l){return '<button class="chip '+(v===cur?'on':'')+'" data-a="chip" data-g="'+g+'" data-v="'+esc(v)+'">'+esc(l||v)+'</button>'}
function sheet(h){$('sheet').innerHTML='<div class="grab"></div>'+h;$('scrim').classList.add('open');$('sheet').classList.add('open')}
function closeS(){$('scrim').classList.remove('open');$('sheet').classList.remove('open')}
function rd(){document.querySelectorAll('#sheet [id^=f_]').forEach(function(i){F[i.id.slice(2)]=i.value})}

/* alerts */
function alerts(){
  var A=[],now=new Date(),mk=ds(now).slice(0,7),isW=function(t){return S.wants.indexOf(t.cat)>-1};
  var ex=S.tx.filter(function(t){return t.type==='exp'});
  var mt=ex.filter(function(t){return t.date.slice(0,7)===mk}),by={};
  mt.forEach(function(t){by[t.cat]=(by[t.cat]||0)+B(t)});
  Object.keys(S.bud).forEach(function(c){var b=+S.bud[c];if(b>0&&by[c]){var r=by[c]/b;
    if(r>=1)A.push({l:'r2',t:c+': over budget by '+fb(by[c]-b)+'.'});
    else if(r>=.8)A.push({l:'',t:c+': '+dg(Math.round(r*100))+'% of the monthly budget used.'})}});
  var w0=ws(now),W=function(a){return sum(ex.filter(function(t){return isW(t)&&t.date>=ds(a)&&t.date<=ds(addDays(a,6))}))};
  var cw=W(w0),pv=0;for(var i=1;i<=4;i++)pv+=W(addDays(w0,-7*i));pv/=4;
  if(cw>500&&pv>0&&cw>pv*1.3)A.push({l:'',t:'Non-essential spending this week is '+dg(Math.round((cw/pv-1)*100))+'% above your recent weekly average.'});
  var tot=sum(mt),wt=sum(mt.filter(isW));
  if(tot>0&&mt.length>=5&&wt/tot>.35)A.push({l:'',t:dg(Math.round(wt/tot*100))+'% of this month’s spending is non-essential.'});
  var inc=sum(S.tx.filter(function(t){return t.type==='inc'&&t.date.slice(0,7)===mk}));
  if(inc>0&&tot>inc)A.push({l:'r2',t:'You have spent more than you earned this month.'});
  return A}
function alertsH(){var a=alerts();return a.length?'<div class="h">Alerts</div>'+a.map(function(x){return '<div class="al '+x.l+'">⚠️ '+esc(x.t)+'</div>'}).join(''):''}

/* overview */
function home(){
  var k=ds(mon).slice(0,7);
  var mt=S.tx.filter(function(t){return t.date.slice(0,7)===k}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
  var ex=mt.filter(function(t){return t.type==='exp'}),te=sum(ex),ti=sum(mt.filter(function(t){return t.type==='inc'}));
  var by={};ex.forEach(function(t){by[t.cat]=(by[t.cat]||0)+B(t)});
  var cats=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  var bal=ti-te;
  var h='<div class="nav"><button data-a="pm" aria-label="Previous month">‹</button><b>'+dg(mon.toLocaleDateString('en-US',{month:'long',year:'numeric'}))+'</b><button data-a="nm" aria-label="Next month">›</button></div><h1>Overview</h1>';
  h+=seg('cur',[['BDT','৳ BDT'],['USD','$ USD']],S.cur,'','cur');
  h+='<div class="g hero"><div class="mut">Spent this month</div><div class="big">'+fb(te)+'</div><div class="two" style="margin:0"><div style="padding:0"><small>Income</small><b class="gr">'+fb(ti)+'</b></div><div style="padding:0"><small>Balance</small><b class="'+(bal<0?'rd':'')+'">'+(bal<0?'−':'')+fb(Math.abs(bal))+'</b></div></div></div>';
  h+=alertsH();
  if(cats.length){h+='<div class="h">By category</div><div class="g">'+cats.map(function(c){
    var b=+S.bud[c]||0,r=b?by[c]/b:by[c]/te,cl=b&&r>=1?'over':b&&r>=.8?'warn':'';
    return '<div class="r col"><div class="rr"><span>'+(EM[c]||'📦')+' '+esc(c)+(S.wants.indexOf(c)>-1?'<small class="tag">non-essential</small>':'')+'</span><b>'+fb(by[c])+'</b></div><div class="pb '+cl+'"><i style="width:'+Math.min(100,r*100)+'%"></i></div>'+(b?'<small>of '+fb(b)+' budget</small>':'')+'</div>'}).join('')+'</div>'}
  if(!mt.length)return h+'<div class="empty">Nothing here yet.<br>Tap + to add an expense or income.</div>';
  var d='',open=false;
  mt.forEach(function(t){
    if(t.date!==d){d=t.date;if(open)h+='</div>';open=true;
      var dt=sum(mt.filter(function(x){return x.date===d&&x.type==='exp'}));

/* weekly review + trend */
function week(){
  var a=wk,A=ds(a),Z=ds(addDays(a,6)),pa=ds(addDays(a,-7)),pb=ds(addDays(a,-1));
  var ex=S.tx.filter(function(t){return t.type==='exp'});
  var cw=ex.filter(function(t){return t.date>=A&&t.date<=Z}),pw=ex.filter(function(t){return t.date>=pa&&t.date<=pb});
  var tc=sum(cw),tp=sum(pw),dn=['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];
  var days=[0,1,2,3,4,5,6].map(function(i){var d=ds(addDays(a,i));return sum(cw.filter(function(t){return t.date===d}))});
  var mx=Math.max.apply(null,days.concat([1])),pk=days.indexOf(Math.max.apply(null,days));
  var bc={},pc={};cw.forEach(function(t){bc[t.cat]=(bc[t.cat]||0)+B(t)});pw.forEach(function(t){pc[t.cat]=(pc[t.cat]||0)+B(t)});
  var cats=Object.keys(bc).sort(function(x,y){return bc[y]-bc[x]});
  var ww=sum(cw.filter(function(t){return S.wants.indexOf(t.cat)>-1}));
  var I=[];

    I.push('You spent <b>'+fb(tc)+'</b>'+(tp?', '+dg(Math.abs(Math.round((tc/tp-1)*100)))+'% '+(tc>=tp?'more':'less')+' than last week':'')+'.');
    I.push('Biggest category: <b>'+esc(cats[0])+'</b> ('+fb(bc[cats[0]])+', '+dg(Math.round(bc[cats[0]]/tc*100))+'%).');
    var big=cw.reduce(function(m,t){return B(t)>B(m)?t:m});
    I.push('Largest single expense: '+esc(big.note||big.cat)+', '+fb(B(big))+'.');
    I.push('Busiest day: '+dn[pk]+'.');
    if(ww>0)I.push('Non-essential spending: '+fb(ww)+' ('+dg(Math.round(ww/tc*100))+'%).'+(ww/tc>.3?' Cutting it by a fifth would save about '+fb(ww*.2)+' a week.':''))}
  var h='<div class="nav"><button data-a="pw" aria-label="Previous week">‹</button><b>'+fd(A)+' – '+fd(Z)+'</b><button data-a="nw" aria-label="Next week">›</button></div><h1>Weekly review</h1>';
  h+=seg('cur',[['BDT','৳ BDT'],['USD','$ USD']],S.cur,'','cur');
  h+='<div class="g hero"><div class="mut">Spent this week</div><div class="big">'+fb(tc)+'</div><small>Last week: '+fb(tp)+'. Weeks run Saturday to Friday.</small></div>';
  h+='<div class="h">Daily spending</div><div class="g"><div class="bars">'+days.map(function(v,i){return '<div class="'+(i===pk&&v>0?'pk':'')+'"><i style="height:'+(v/mx*78)+'px"></i><small>'+dn[i]+'</small></div>'}).join('')+'</div></div>';
  h+='<div class="h">Your week in short</div><div class="g ins">'+I.map(function(x){return '<p>'+x+'</p>'}).join('')+'</div>';
  if(cats.length)h+='<div class="h">Versus last week</div><div class="g">'+cats.map(function(c){
    var p=pc[c],dl=p?Math.round((bc[c]/p-1)*100):null;
    return '<div class="r"><span class="ic">'+(EM[c]||'📦')+'</span><span class="mid"><b>'+esc(c)+'</b><small>'+(dl===null?'New this week':(dl>=0?'Up ':'Down ')+dg(Math.abs(dl))+'%')+'</small></span><b>'+fb(bc[c])+'</b></div>'}).join('')+'</div>';
  h+=alertsH();
  /* 6-month trend */
  var now=new Date(),ms=[];
  for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1),k=ds(d).slice(0,7);
    ms.push({l:dg(d.toLocaleDateString('en-US',{month:'short'})),e:sum(ex.filter(function(t){return t.date.slice(0,7)===k})),i:sum(S.tx.filter(function(t){return t.type==='inc'&&t.date.slice(0,7)===k}))})}
  var m2=Math.max.apply(null,ms.map(function(x){return Math.max(x.e,x.i)}).concat([1]));
  var svg='<svg viewBox="0 0 300 130" width="100%" role="img" aria-label="Six month spending and income trend">'+ms.map(function(x,i){var he=x.e/m2*96,hi=x.i/m2*96,ox=i*50+8;
    return '<rect class="be" x="'+ox+'" y="'+(104-he)+'" width="15" height="'+he+'" rx="3"/><rect class="bi" x="'+(ox+17)+'" y="'+(104-hi)+'" width="15" height="'+hi+'" rx="3"/><text x="'+(ox+16)+'" y="122" text-anchor="middle">'+x.l+'</text>'}).join('')+'</svg>';
  var prev=(ms[2].e+ms[3].e+ms[4].e)/3,cur=ms[5].e,tr=prev>0?Math.round((cur/prev-1)*100):null;
  h+='<div class="h">Six month trend</div><div class="g" style="padding:14px">'+svg+'<small><span class="rd" style="color:var(--blue)">■</span> Spent &nbsp;<span style="color:var(--grn)">■</span> Income</small>'+(tr!==null?'<p style="margin:8px 0 0;font-size:14px">This month is '+dg(Math.abs(tr))+'% '+(tr>=0?'above':'below')+' your average of the previous three months.</p>':'')+'</div>';
  return h}

  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(e){if(!e||e.name!=='AbortError')dl()});return}

function liveFx(q){
  if(!q)toast('Fetching rates…');
  fetch('https://open.er-api.com/v6/latest/USD').then(function(r){return r.json()}).then(function(d){
    var r=d&&d.rates,cc=S.cc.code;if(!r||!(r.BDT>0))throw 0;var miss=!(r[cc]>0);
    S.fx.USD=Math.round(r.BDT*100)/100;if(!miss)S.fx[cc]=Math.round(r.BDT/r[cc]*10000)/10000;
    S.fxAt=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});S.fxDay=tdy();
    save();render();if(!q)toast(miss?'USD updated. No rate found for '+cc+', type it in.':'Rates updated')
  }).catch(function(){if(!q)toast('Could not fetch rates. Check your internet or type them in.')})}

/* ===== Trips ===== */
var TCAT=['Stay','Food','Transport','Tickets','Shopping','Fun','Other'],TEM={Stay:'🏨',Food:'🍽️',Transport:'🚌',Tickets:'🎟️',Shopping:'🛍️',Fun:'🎬',Other:'📦'};
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function genCode(){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function getT(c){return S.trips.filter(function(t){return t.code===c})[0]}
function nm(t,id){var m=t.members.filter(function(x){return x.id===id})[0];return m?m.name:'Someone'}
function tripTx(){var o=[];S.trips.forEach(function(t){if(t.done&&t.doneAmt>0)o.push({id:t.doneId||1,type:'exp',amt:t.doneAmt,cur:'BDT',cat:'Trips',pay:'Trip',note:'Trip: '+t.name,date:t.doneDate||tdy(),trip:t.code})});return o}
function syncTx(){S.tx=S.tx.filter(function(t){return !t.trip}).concat(tripTx())}

/* cloud (Firestore REST) */
function cloudOK(){return !!(S.cloud&&S.cloud.pid&&S.cloud.key)}
function fsUrl(code){return 'https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(S.cloud.pid)+'/databases/(default)/documents/trips/'+encodeURIComponent(code)}
function pull(code){return fetch(fsUrl(code)+'?key='+encodeURIComponent(S.cloud.key)).then(function(r){if(r.status===404)return null;if(!r.ok)throw 0;return r.json()}).then(function(d){return d&&d.fields&&d.fields.data?JSON.parse(d.fields.data.stringValue):null})}
function push(t){var body={fields:{data:{stringValue:JSON.stringify({name:t.name,members:t.members,exp:t.exp})}}};
  return fetch(fsUrl(t.code)+'?key='+encodeURIComponent(S.cloud.key)+'&updateMask.fieldPaths=data',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw 0})}
function mergeT(a,b){var m={},e={};
  a.members.concat(b.members||[]).forEach(function(x){if(!m[x.id])m[x.id]=x});
  (a.exp||[]).concat(b.exp||[]).forEach(function(x){var o=e[x.id];if(!o||(x.ts||0)>=(o.ts||0))e[x.id]=x});
  a.members=Object.keys(m).map(function(k){return m[k]});a.exp=Object.keys(e).map(function(k){return e[k]});if(b.name)a.name=b.name}
function syncTrip(t,q){if(!cloudOK()||!t||!t.shared)return;
  pull(t.code).then(function(d){if(d)mergeT(t,d);return push(t)}).then(function(){syncTx();save();if(tab==='trips'||tab==='home')render()}).catch(function(){if(!q)toast('Could not sync. Saved on this phone.')})}
function tripSaved(t){syncTx();save();render();syncTrip(t,true)}

/* balances */
function bal(t){var net={},tot=0,mine=0;t.members.forEach(function(m){net[m.id]=0});
  t.exp.forEach(function(e){if(e.del)return;var r=R(e.cur);net[e.by]=(net[e.by]||0)+e.amt*r;
    Object.keys(e.sh).forEach(function(k){net[k]=(net[k]||0)-e.sh[k]*r;if(!e.st&&k===t.me)mine+=e.sh[k]*r});
    if(!e.st)tot+=e.amt*r});
  return {net:net,tot:tot,mine:mine}}
function xfers(net){var c=[],d=[],o=[];
  Object.keys(net).forEach(function(k){if(net[k]>1)c.push([k,net[k]]);else if(net[k]<-1)d.push([k,-net[k]])});
  c.sort(function(a,b){return b[1]-a[1]});d.sort(function(a,b){return b[1]-a[1]});
  var i=0,j=0;while(i<c.length&&j<d.length){var a=Math.min(c[i][1],d[j][1]);o.push({f:d[j][0],t:c[i][0],a:a});c[i][1]-=a;d[j][1]-=a;if(c[i][1]<1)i++;if(d[j][1]<1)j++}
  return o}

/* views */
function trips(){var t=tv&&getT(tv);if(!t){tv=null;return tripList()}return tripView(t)}
function tripList(){
  var h='<div class="top"><h1>Trips</h1><button class="lnk" data-a="newtrip">New trip</button></div>';
  if(!S.trips.length)h+='<div class="empty">Plan a vacation or outing here.<br>Add shared costs, split them, and see who owes whom.</div>';
  else h+='<div class="g">'+S.trips.map(function(t){var b=bal(t);
    return '<button class="r" data-a="trip" data-v="'+esc(t.code)+'"><span class="ic">✈️</span><span class="mid"><b>'+esc(t.name)+'</b><small>'+(t.done?'Completed · ':'')+t.members.length+' people · '+(t.shared?'Shared':'On this phone only')+'</small></span><span class="amt2">'+fb(b.tot)+'<small>total</small></span></button>'}).join('')+'</div>';
  return h+'<div class="btns"><button class="b" data-a="jointrip">Join a trip with a code</button></div>'}
function tripView(t){
  var b=bal(t),mine=b.net[t.me]||0,x=xfers(b.net);
  var h='<div class="top"><button class="lnk" data-a="tback">‹ Trips</button></div><h1>'+esc(t.name)+'</h1>';
  h+=seg('cur',[['BDT','৳ BDT'],['USD','$ USD']],S.cur,'','cur');
  h+='<div class="g hero"><div class="mut">Trip total</div><div class="big">'+fb(b.tot)+'</div><small>Your share so far: '+fb(b.mine)+'. It is deducted from your main account when you complete the trip.</small></div>';
  h+='<div class="two"><div><small>'+(mine>=1?'You are owed':mine<=-1?'You owe':'You are settled')+'</small><b class="'+(mine>=1?'gr':mine<=-1?'rd':'')+'">'+fb(Math.abs(mine))+'</b></div><div><small>Trip code</small><b>'+(t.shared?esc(t.code):'Not shared')+'</b></div></div>';
  h+=(t.done?'<div class="al" style="background:color-mix(in srgb,var(--grn) 16%,var(--card))">✅ Completed. '+fb(t.doneAmt)+' was deducted from your main account on '+fd(t.doneDate)+'.</div><div class="btns" style="margin:0 0 6px"><button class="b" data-a="treopen">Reopen trip</button></div>':'<div class="btns" style="margin:0 0 6px"><button class="b" data-a="tshare">'+(t.shared?'Invite people':'Share this trip')+'</button><button class="b p" data-a="addte">+ Add expense</button></div><div class="btns" style="margin:0 0 6px"><button class="b" data-a="tdone" style="color:var(--grn)">Complete trip and deduct my share</button></div>');
  h+='<div class="h">People</div><div class="g">'+t.members.map(function(m){var n=b.net[m.id]||0;
    return '<div class="r"><span class="ic">👤</span><span class="mid"><b>'+esc(m.name)+(m.id===t.me?' (you)':'')+'</b></span><b class="'+(n>=1?'gr':n<=-1?'rd':'')+'">'+(n>=1?'gets back ':n<=-1?'owes ':'settled ')+(Math.abs(n)>=1?fb(Math.abs(n)):'')+'</b></div>'}).join('')+'<button class="r" data-a="addper" style="color:var(--blue)">+ Add a person</button></div>';
  if(x.length)h+='<div class="h">Settle up</div><div class="g">'+x.map(function(y){
    return '<div class="r"><span class="mid"><b>'+esc(nm(t,y.f))+' pays '+esc(nm(t,y.t))+'</b></span><b>'+fb(y.a)+'</b><button class="lnk" style="padding:0" data-a="settle" data-f="'+y.f+'" data-t="'+y.t+'" data-v="'+(Math.round(y.a*100)/100)+'">Mark paid</button></div>'}).join('')+'</div>';
  var L=t.exp.filter(function(e){return !e.del}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
  if(!L.length)h+='<div class="empty">No expenses yet.<br>Tap + Add expense to record the first one.</div>';
  else h+='<div class="h">Expenses</div><div class="g">'+L.map(function(e){var n=Object.keys(e.sh).length;
    return '<button class="r" data-a="te" data-v="'+e.id+'"><span class="ic">'+(e.st?'💸':TEM[e.cat]||'🧾')+'</span><span class="mid"><b>'+esc(e.st?nm(t,e.by)+' paid '+nm(t,Object.keys(e.sh)[0]):(e.note||'Expense'))+'</b><small>'+(e.st?'Settlement':esc(e.cat||'Other')+' · Paid by '+esc(nm(t,e.by))+' · split '+n+(n===1?' way':' ways'))+' · '+fd(e.date)+'</small></span><span class="amt2">'+fb(e.amt*R(e.cur))+(e.cur!==S.cur?'<small>'+fm(e.amt,e.cur)+'</small>':'')+'</span></button>'}).join('')+'</div>';
  return h+'<div class="btns"><button class="b d" style="flex:1" data-a="deltrip">Remove trip from this phone</button></div>'}

/* new trip / join */
function openNewTrip(){F={name:'',me:S.me||''};SF=ntS;ntS()}
function ntS(){sheet('<h3>New trip</h3><div class="g"><input class="in" id="f_name" placeholder="Trip name (e.g. Cox’s Bazar)" maxlength="40" value="'+esc(F.name)+'" aria-label="Trip name"><input class="in" id="f_me" placeholder="Your name" maxlength="30" value="'+esc(F.me)+'" aria-label="Your name"></div><p class="note">You can add people now, or invite them later with a code.</p><div class="btns"><button class="b" data-a="x">Cancel</button><button class="b p" data-a="dotrip">Create</button></div>')}
function saveNewTrip(){rd();var n=(F.name||'').trim(),me=(F.me||'').trim();if(!n||!me){toast('Enter a trip name and your name.');return}
  var id=uid(),code=genCode();S.trips.push({code:code,name:n,members:[{id:id,name:me}],exp:[],me:id,shared:false});S.me=me;tv=code;syncTx();save();closeS();render()}
function openJoin(){F={code:'',me:S.me||''};SF=jnS;jnS()}
function jnS(){sheet('<h3>Join a trip</h3><div class="g"><input class="in" id="f_code" placeholder="Trip code" maxlength="8" autocapitalize="characters" value="'+esc(F.code)+'" aria-label="Trip code"><input class="in" id="f_me" placeholder="Your name" maxlength="30" value="'+esc(F.me)+'" aria-label="Your name"></div><p class="note">Use the same name the trip owner added for you, or a new name to join as a new person.</p><div class="btns"><button class="b" data-a="x">Cancel</button><button class="b p" data-a="dojoin">Join</button></div>')}
function doJoin(){rd();var code=(F.code||'').trim().toUpperCase(),me=(F.me||'').trim();
  if(!code||!me){toast('Enter the code and your name.');return}
  if(!cloudOK()){toast('First add your Project ID and API key in Settings.');return}
  if(getT(code)){closeS();tv=code;tab='trips';render();return}
  toast('Looking for the trip…');
  pull(code).then(function(d){
    if(!d){toast('No trip found with that code.');return}
    var mem=d.members||[],m=mem.filter(function(x){return x.name.toLowerCase()===me.toLowerCase()})[0],isNew=!m;
    if(!m){m={id:uid(),name:me};mem=mem.concat([m])}
    var t={code:code,name:d.name,members:mem,exp:d.exp||[],me:m.id,shared:true};
    S.trips.push(t);S.me=me;tv=code;tab='trips';syncTx();save();closeS();render();
    if(isNew)push(t).catch(function(){})
  }).catch(function(){toast('Could not reach the trip. Check the code, keys and internet.')})}
function shareTrip(){var t=getT(tv);
  if(!cloudOK()){toast('First add your Project ID and API key in Settings.');return}
  if(!t.shared){toast('Putting the trip online…');push(t).then(function(){t.shared=true;save();render();toast('Trip is online. Tap Invite people to send the code.')}).catch(function(){toast('Could not reach the cloud. Check your keys and internet.')});return}
  var txt='Join my trip “'+t.name+'” in Spend. Trip code: '+t.code+'. App: '+location.href.split('#')[0];
  if(navigator.share)navigator.share({text:txt}).catch(function(){});else prompt('Copy this and send it:',txt)}
function completeTrip(){var t=getT(tv),h=[],tot=0;
  t.exp.filter(function(e){return !e.del&&!e.st}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id}).forEach(function(e){
    var r=R(e.cur),m=Math.round((e.sh[t.me]||0)*r*100)/100;tot+=m;
    h.push({d:e.date,n:e.note||'',c:e.cat||'Other',p:nm(t,e.by),a:Math.round(e.amt*r*100)/100,m:m})});
  tot=Math.round(tot*100)/100;
  if(!confirm(tot>0?'Complete this trip? Your share of '+fm(cv(tot))+' will be deducted from your main account and saved in Money → Trip history, with every expense.':'You have no share in this trip. Mark it completed anyway?'))return;
  t.done=1;t.doneAmt=tot;t.doneDate=tdy();t.doneId=Date.now();t.hist=h;tripSaved(t);toast('Trip completed')}
function reopenTrip(){var t=getT(tv);if(!confirm('Reopen this trip? The deduction and its history entry are removed until you complete it again.'))return;t.done=0;t.hist=null;tripSaved(t)}
function histList(){var D=S.trips.filter(function(t){return t.done}).sort(function(a,b){return (b.doneDate||'')<(a.doneDate||'')?-1:1});
  var tot=D.reduce(function(s,t){return s+(t.doneAmt||0)},0);
  var h='<div class="two"><div><small>Total deducted</small><b>'+fb(tot)+'</b></div><div><small>Completed trips</small><b>'+dg(D.length)+'</b></div></div>';
  if(!D.length)return h+'<div class="empty">No completed trips yet.<br>When you complete a trip, your share is deducted from your main account and listed here with every expense.</div>';
  return h+'<div class="h">Deductions from main account</div><div class="g">'+D.map(function(t){return '<button class="r" data-a="hist" data-v="'+esc(t.code)+'"><span class="ic">✈️</span><span class="mid"><b>'+esc(t.name)+'</b><small>Deducted '+fd(t.doneDate)+' · '+(t.hist||[]).length+' expenses</small></span><b>−'+fb(t.doneAmt||0)+'</b></button>'}).join('')+'</div>'}
function openHist(code){var t=getT(code);if(!t)return;SF=function(){};var H=t.hist||[],bc={};H.forEach(function(x){bc[x.c]=(bc[x.c]||0)+x.m});
  var cs=Object.keys(bc).sort(function(a,b){return bc[b]-bc[a]});
  sheet('<h3>'+esc(t.name)+'</h3><div class="g hero"><div class="mut">Deducted from your main account</div><div class="big">−'+fb(t.doneAmt||0)+'</div><small>Completed '+fd(t.doneDate)+'.</small></div>'+
  (H.length?'<div class="h">By category (your share)</div><div class="g">'+cs.map(function(c){return '<div class="r"><span class="ic">'+(TEM[c]||'📦')+'</span><span class="mid"><b>'+esc(c)+'</b></span><b>'+fb(bc[c])+'</b></div>'}).join('')+'</div><div class="h">All trip expenses</div><div class="g">'+H.map(function(x){return '<div class="r"><span class="ic">'+(TEM[x.c]||'📦')+'</span><span class="mid"><b>'+esc(x.n||x.c)+'</b><small>'+esc(x.c)+' · '+fd(x.d)+' · paid by '+esc(x.p)+' · total '+fb(x.a)+'</small></span><b>'+fb(x.m)+'</b></div>'}).join('')+'</div>':'<p class="note">Details were not saved for this trip. Reopen it and complete it again to record them.</p>')+
  '<div class="btns"><button class="b" data-a="x">Close</button><button class="b p" data-a="opentrip" data-v="'+esc(code)+'">Open trip</button></div>')}
function addPerson(){var t=getT(tv),n=prompt('Name of the person to add');if(!n||!n.trim())return;t.members.push({id:uid(),name:n.trim()});tripSaved(t)}
function delTrip(){if(!confirm('Remove this trip from this phone? Other people keep their copy.'))return;S.trips=S.trips.filter(function(t){return t.code!==tv});tv=null;syncTx();save();render()}
function settle(f,to,a){var t=getT(tv);a=Math.round(a*100)/100;if(!(a>0))return;
  if(!confirm(nm(t,f)+' paid '+nm(t,to)+' '+fm(cv(a))+'?'))return;
  var sh={};sh[to]=a;t.exp.push({id:Date.now(),by:f,amt:a,cur:'BDT',note:'Settlement',date:tdy(),sh:sh,st:1,ts:Date.now()});tripSaved(t)}

/* trip expense sheet */
function openTE(id){var t=getT(tv),e=id?t.exp.filter(function(x){return x.id===id})[0]:null;
  if(t.done&&!(e&&e.st)){toast('This trip is completed. Reopen it to change expenses.');return}
  if(e&&e.st){if(confirm('Remove this settlement record?')){e.del=1;e.ts=Date.now();tripSaved(t)}return}
  if(e){F={id:e.id,by:e.by,amt:String(e.amt),cur:e.cur,note:e.note||'',cat:e.cat||'Other',date:e.date,mode:'cu',wi:Object.keys(e.sh)};Object.keys(e.sh).forEach(function(k){F['c_'+k]=String(e.sh[k])})}
  else F={id:0,by:t.me||t.members[0].id,amt:'',cur:S.cur,note:'',cat:'Other',date:tdy(),mode:'eq',wi:t.members.map(function(m){return m.id})};
  SF=teS;teS()}
function teS(){var t=getT(tv);
  sheet('<h3>'+(F.id?'Edit':'Add')+' trip expense</h3>'+
  '<div class="g amt"><input id="f_amt" inputmode="decimal" placeholder="0" value="'+esc(F.amt)+'" aria-label="Amount">'+seg('cur',[['BDT','৳'],['USD','$']],F.cur,'s')+'</div>'+
  '<div class="g"><input class="in" id="f_note" placeholder="Comment (what was it for?)" maxlength="80" value="'+esc(F.note)+'" aria-label="Note"><div class="r"><span>Date</span><input class="in" id="f_date" type="date" value="'+F.date+'"></div></div>'+
  '<div class="h">Category</div><div class="chips">'+TCAT.map(function(c){return chip('cat',c,F.cat,TEM[c]+' '+c)}).join('')+'</div>'+'<div class="h">Paid by</div><div class="chips">'+t.members.map(function(m){return chip('by',m.id,F.by,m.name)}).join('')+'</div>'+
  '<div class="h">Split</div>'+seg('mode',[['eq','Equally'],['cu','Custom amounts']],F.mode)+
  (F.mode==='eq'?'<div class="chips">'+t.members.map(function(m){return '<button class="chip '+(F.wi.indexOf(m.id)>-1?'on':'')+'" data-a="tm" data-v="'+m.id+'">'+esc(m.name)+'</button>'}).join('')+'</div><p class="note">Shared equally between the highlighted people.</p>'
  :'<div class="g">'+t.members.map(function(m){return '<div class="r"><span>'+esc(m.name)+'</span><input class="in" id="f_c_'+m.id+'" inputmode="decimal" placeholder="0" value="'+esc(F['c_'+m.id]||'')+'" aria-label="Share of '+esc(m.name)+'"></div>'}).join('')+'</div><p class="note">The amounts must add up to the total.</p>')+
  '<div class="btns">'+(F.id?'<button class="b d" data-a="delte">Delete</button>':'')+'<button class="b" data-a="x">Cancel</button><button class="b p" data-a="savete">Save</button></div>')}
function saveTE(){rd();var t=getT(tv),a=num(F.amt);if(!(a>0)){toast('Enter an amount above zero.');return}
  a=Math.round(a*100)/100;var sh={};
  if(F.mode==='eq'){if(!F.wi.length){toast('Pick at least one person.');return}
    var n=F.wi.length,each=Math.floor(a/n*100)/100,used=0;
    F.wi.forEach(function(k,i){var v=i===n-1?Math.round((a-used)*100)/100:each;sh[k]=v;used+=v})}
  else{var s=0;t.members.forEach(function(m){var v=num(F['c_'+m.id]);if(v>0){sh[m.id]=Math.round(v*100)/100;s+=sh[m.id]}});
    if(Math.abs(s-a)>0.01){toast('Custom amounts add up to '+fm(s,F.cur)+', not '+fm(a,F.cur)+'.');return}}
  var r={id:F.id||Date.now(),by:F.by,amt:a,cur:F.cur,note:(F.note||'').trim(),cat:F.cat||'Other',date:F.date||tdy(),sh:sh,ts:Date.now()};
  t.exp=F.id?t.exp.map(function(x){return x.id===F.id?r:x}):t.exp.concat([r]);
  closeS();tripSaved(t);toast('Saved')}
function delTE(){if(!confirm('Delete this expense?'))return;var t=getT(tv);t.exp.forEach(function(x){if(x.id===F.id){x.del=1;x.ts=Date.now()}});closeS();tripSaved(t)}

/* events */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case 'tab':tab=v;render();scrollTo(0,0);break;
    case 'pm':mon=new Date(mon.getFullYear(),mon.getMonth()-1,1);render();break;
    case 'nm':mon=new Date(mon.getFullYear(),mon.getMonth()+1,1);render();break;
    case 'pw':wk=addDays(wk,-7);render();break;
    case 'nw':wk=addDays(wk,7);render();break;
    case 'cur':S.cur=v;save();render();break;
    case 'lt':lt=v;render();break;
    case 'add':openTx();break;
    case 'tx':openTx(+v);break;
    case 'addloan':openLoan();break;
    case 'loan':openLoan(+v);break;
    case 'addinv':openInv();break;
    case 'inv':openInv(+v);break;
    case 'seg':case 'chip':rd();F[el.dataset.g]=v;SF();break;
    case 'savetx':saveTx();break;
    case 'saveloan':saveLoan();break;
    case 'saveinv':saveInv();break;
    case 'deltx':del('tx');break;
    case 'delloan':del('loan');break;
    case 'delinv':del('inv');break;
    case 'addpay':rd();var p=num(F.pay);if(!(p>0)){toast('Enter a payment amount.');break}
      F.pays=(F.pays||[]).concat([{amt:p,date:tdy()}]);F.pay='';if(saveLoan(true)){loanS();render();toast('Payment recorded')}break;
    case 'newtrip':openNewTrip();break;
    case 'dotrip':saveNewTrip();break;
    case 'jointrip':openJoin();break;
    case 'dojoin':doJoin();break;
    case 'trip':tv=v;render();scrollTo(0,0);syncTrip(getT(v),true);break;
    case 'tback':tv=null;render();break;
    case 'tshare':shareTrip();break;
    case 'deltrip':delTrip();break;
    case 'addte':openTE();break;
    case 'te':openTE(+v);break;
    case 'tm':rd();var ix=F.wi.indexOf(v);if(ix>-1)F.wi.splice(ix,1);else F.wi.push(v);teS();break;
    case 'savete':saveTE();break;
    case 'delte':delTE();break;
    case 'addper':addPerson();break;
    case 'settle':settle(el.dataset.f,el.dataset.t,+v);break;
    case 'tdone':completeTrip();break;
    case 'treopen':reopenTrip();break;
    case 'theme':S.theme=v;save();applyTheme();render();break;
    case 'pal':S.pal=v;save();applyTheme();render();break;
    case 'cpy':copyBackup();break;
    case 'pst':openPaste();break;
    case 'dopst':var tx=$('f_txt').value;closeS();applyBackup(tx);break;
    case 'hist':openHist(v);break;
    case 'opentrip':closeS();tab='trips';tv=v;render();scrollTo(0,0);break;
    case 'fx':liveFx();break;
    case 'csv':csv();break;
    case 'bak':out('spend-backup-'+tdy()+'.json',JSON.stringify(S),'text/plain');break;
    case 'res':$('imf').click();break;
    case 'x':closeS();break;
  }});
document.addEventListener('change',function(ev){
  var t=ev.target,c=t.dataset.ch;
  if(t.id==='imf'){if(t.files[0])restore(t.files[0]);t.value='';return}
  if(!c)return;
  if(c==='rate'){var n=num(t.value),k=t.dataset.v;if(n>0){S.fx[k]=n;save();toast('Rate updated')}else{t.value=S.fx[k];toast('Enter a rate above zero.')}}
  else if(c==='cpid'||c==='ckey'){S.cloud=S.cloud||{};S.cloud[c==='cpid'?'pid':'key']=t.value.trim();save();toast('Saved')}
  else if(c==='ccode'){var cv2=t.value.trim().toUpperCase(),old=S.cc.code;
    if(!/^[A-Z]{2,5}$/.test(cv2)||cv2==='BDT'||cv2==='USD'){t.value=old;toast('Use 2 to 5 letters, for example EUR.');return}
    S.cc.code=cv2;if(!S.fx[cv2])S.fx[cv2]=1;if(!S.sym[cv2])S.sym[cv2]=cv2;if(S.cur===old)S.cur=cv2;save();render();toast('Now set the rate for '+cv2+' below.');liveFx(true)}
  else if(c==='csym'){S.sym[S.cc.code]=t.value.trim()||S.cc.code;save();render()}
  else if(c==='tint'){S.pal='custom';S.tint=t.value;save();applyTheme()}
  else if(c==='bn'){S.bn=t.checked;save();render()}
  else if(c==='want'){var v=t.dataset.v,i=S.wants.indexOf(v);if(t.checked&&i<0)S.wants.push(v);if(!t.checked&&i>-1)S.wants.splice(i,1);save()}
  else if(c==='bud'){var b=num(t.value);if(b>0)S.bud[t.dataset.v]=b;else delete S.bud[t.dataset.v];save()}});

load();
fxFix();syncTx();applyTheme();var n0=new Date();mon=new Date(n0.getFullYear(),n0.getMonth(),1);wk=ws(n0);
render();
if(S.fxDay!==tdy())liveFx(true);
setInterval(function(){var t=tab==='trips'&&tv&&getT(tv);if(t&&t.shared&&!$('sheet').classList.contains('open'))syncTrip(t,true)},20000);
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
})();
</script>
