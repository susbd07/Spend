<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spend">
<meta name="theme-color" content="#007aff">
<title>Spend</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23007aff'/%3E%3Ctext x='90' y='124' font-size='100' text-anchor='middle' fill='white' font-family='Arial'%3E%E0%A7%B3%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#000;--mut:#8a8a8e;--line:#e5e5ea;--blue:#007aff;--grn:#34c759;--red:#ff3b30;--org:#ff9500;--fill:#e9e9ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--ink:#fff;--mut:#98989f;--line:#38383a;--blue:#0a84ff;--grn:#30d158;--red:#ff453a;--org:#ff9f0a;--fill:#2c2c2e}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:6px 16px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:4px 0 12px}
h3{margin:2px 0 14px;font-size:17px;text-align:center}
.mut,small{color:var(--mut)}small{font-size:12px}
.nav{display:flex;align-items:center;justify-content:space-between;font-size:15px}
.nav button{font-size:26px;color:var(--blue);width:44px;height:36px}
.top{display:flex;align-items:flex-end;justify-content:space-between}
.lnk{color:var(--blue);font-size:17px;padding:8px 0}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 12px}
.seg button{flex:1;padding:7px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg.s{margin:0;flex:none}
.g{background:var(--card);border-radius:12px;overflow:hidden;margin:0 0 6px}
.h{margin:20px 16px 6px;font-size:13px;color:var(--mut)}
.r{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;width:100%;text-align:left;font-size:16px}
.r+.r::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--line)}
.r.col{flex-direction:column;align-items:stretch;gap:4px}
.rr{display:flex;justify-content:space-between;gap:10px}
.ic{width:34px;height:34px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.mid b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt2{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
.gr{color:var(--grn)}.rd{color:var(--red)}
.hero{padding:16px}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.two>div{background:var(--card);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.two b{font-size:20px;font-variant-numeric:tabular-nums}
.pb{height:5px;border-radius:3px;background:var(--fill);overflow:hidden}
.pb i{display:block;height:100%;background:var(--blue);border-radius:3px}
.pb.warn i{background:var(--org)}.pb.over i{background:var(--red)}
.tag{background:var(--fill);border-radius:5px;padding:1px 5px;margin-left:4px}
.al{border-radius:12px;padding:12px 14px;margin:0 0 6px;font-size:14px;line-height:1.35;background:color-mix(in srgb,var(--org) 16%,var(--card))}
.al.r2{background:color-mix(in srgb,var(--red) 14%,var(--card))}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:112px;padding:12px 14px 8px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars i{display:block;width:100%;max-width:26px;background:var(--blue);border-radius:5px 5px 2px 2px;min-height:2px}
.bars .pk i{background:var(--org)}
.ins{padding:14px;font-size:15px;line-height:1.5}.ins p{margin:0 0 8px}.ins p:last-child{margin:0}
svg text{fill:var(--mut);font-size:10px}.be{fill:var(--blue)}.bi{fill:var(--grn)}
.empty{text-align:center;color:var(--mut);padding:36px 12px;line-height:1.5}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.ti{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-around;padding:6px 0 4px}
.ti button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--mut);min-width:64px}
.ti button.on{color:var(--blue)}
.ti .plus{width:50px;height:50px;border-radius:50%;background:var(--blue);color:#fff;font-size:30px;line-height:1;min-width:0;justify-content:center;margin-top:-14px;box-shadow:0 4px 14px rgba(0,122,255,.45)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20}.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-radius:14px 14px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:93%;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;max-width:520px;margin:0 auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.amt{display:flex;align-items:center;padding:6px 10px 6px 14px;margin:0 0 6px}
.amt input{flex:1;min-width:0;border:0;background:none;font-size:34px;font-weight:700;padding:6px 0}
.amt input:focus,.in:focus{outline:none}
.in{width:100%;border:0;background:none;padding:13px 14px;font-size:16px}
.r .in{width:auto;flex:1;min-width:0;text-align:right;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.chip{padding:8px 13px;border-radius:18px;background:var(--card);font-size:14px;border:1.5px solid transparent}
.chip.on{border-color:var(--blue);color:var(--blue);font-weight:600}
.btns{display:flex;gap:10px;margin-top:14px}
.b{flex:1;padding:14px;border-radius:12px;font-weight:600;font-size:16px;background:var(--card)}
.b.p{background:var(--blue);color:#fff}.b.d{color:var(--red);flex:0 0 auto;padding:14px 18px}
.sw{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:14px;background:var(--fill);position:relative;transition:.2s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.2s}
.sw:checked{background:var(--grn)}.sw:checked::after{transform:translateX(18px)}
.bud{width:74px!important;flex:none!important;background:var(--fill);border-radius:7px;padding:6px 8px!important}
.note{font-size:13px;color:var(--mut);line-height:1.45;margin:6px 16px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs"><div class="ti">
<button data-a="tab" data-v="home" data-tab="home"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Overview</button>
<button data-a="tab" data-v="week" data-tab="week"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg>Review</button>
<button class="plus" data-a="add" aria-label="Add transaction">+</button>
<button data-a="tab" data-v="money" data-tab="money"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>Money</button>
<button data-a="tab" data-v="set" data-tab="set"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Settings</button>
</div></nav>
<div class="scrim" id="scrim" data-a="x"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
var KEY='spend.v2';
var EC=['Groceries','Eating out','Transport','Rent','Bills','Mobile & net','Education','Health','Shopping','Fun','Family','Zakat & donation','Other'];
var IC=['Salary','Business','Gift','Other'];
var PAY=['Cash','bKash','Nagad','Rocket','Bank','Card'];
var IK=['DPS','FDR','Sanchayapatra','Stocks (DSE)','Gold','Crypto','Business','Other'];
var EM={'Groceries':'🛒','Eating out':'🍽️','Transport':'🚌','Rent':'🏠','Bills':'💡','Mobile & net':'📶','Education':'🎓','Health':'💊','Shopping':'🛍️','Fun':'🎬','Family':'👪','Zakat & donation':'🤲','Other':'📦'};
var S={tx:[],loans:[],inv:[],cur:'BDT',rate:120,bn:false,bud:{},wants:['Eating out','Shopping','Fun']};
var tab='home',lt='loans',F={},SF=function(){},mon,wk;
var $=function(i){return document.getElementById(i)};
var p2=function(n){return n<10?'0'+n:''+n};
var ds=function(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
var pd=function(s){return new Date(s+'T00:00:00')};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
function ws(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+1)%7));return x}
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var BD='০১২৩৪৫৬৭৮৯';
function dg(s){return S.bn?String(s).replace(/[0-9]/g,function(d){return BD[d]}):s}
function num(s){var x=parseFloat(String(s).replace(/[০-৯]/g,function(d){return BD.indexOf(d)}).replace(/,/g,''));return isFinite(x)?x:NaN}
function fm(n,c){c=c||S.cur;var u=c==='USD';return dg((u?'$':'৳')+Math.abs(n).toLocaleString(u?'en-US':'en-IN',{minimumFractionDigits:u?2:0,maximumFractionDigits:u?2:0}))}
var B=function(x){return x.cur==='USD'?x.amt*S.rate:x.amt};
var cv=function(b){return S.cur==='USD'?b/S.rate:b};
var fb=function(b){return fm(cv(b))};
var sum=function(a){return a.reduce(function(s,t){return s+B(t)},0)};
var fd=function(s){return dg(pd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}))};
var tdy=function(){return ds(new Date())};
var toastT;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2400)}

function load(){try{var r=localStorage.getItem(KEY);if(r){Object.assign(S,JSON.parse(r));return}
r=localStorage.getItem('spend.v1');if(r){var o=JSON.parse(r);S.tx=(o.expenses||[]).map(function(e){return Object.assign({type:'exp',pay:'Cash'},e)});S.cur=o.cur==='USD'?'USD':'BDT';S.rate=+o.rate>0?+o.rate:120}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save. Storage may be full.')}}

/* helpers for markup */
function seg(g,o,v,cls,act){return '<div class="seg '+(cls||'')+'">'+o.map(function(x){return '<button class="'+(x[0]===v?'on':'')+'" data-a="'+(act||'seg')+'" data-g="'+g+'" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'}
function chip(g,v,cur,l){return '<button class="chip '+(v===cur?'on':'')+'" data-a="chip" data-g="'+g+'" data-v="'+esc(v)+'">'+esc(l||v)+'</button>'}
function sheet(h){$('sheet').innerHTML='<div class="grab"></div>'+h;$('scrim').classList.add('open');$('sheet').classList.add('open')}
function closeS(){$('scrim').classList.remove('open');$('sheet').classList.remove('open')}
function rd(){document.querySelectorAll('#sheet [id^=f_]').forEach(function(i){F[i.id.slice(2)]=i.value})}

/* alerts */
function alerts(){
  var A=[],now=new Date(),mk=ds(now).slice(0,7),isW=function(t){return S.wants.indexOf(t.cat)>-1};
  var ex=S.tx.filter(function(t){return t.type==='exp'});
  var mt=ex.filter(function(t){return t.date.slice(0,7)===mk}),by={};
  mt.forEach(function(t){by[t.cat]=(by[t.cat]||0)+B(t)});
  Object.keys(S.bud).forEach(function(c){var b=+S.bud[c];if(b>0&&by[c]){var r=by[c]/b;
    if(r>=1)A.push({l:'r2',t:c+': over budget by '+fb(by[c]-b)+'.'});
    else if(r>=.8)A.push({l:'',t:c+': '+dg(Math.round(r*100))+'% of the monthly budget used.'})}});
  var w0=ws(now),W=function(a){return sum(ex.filter(function(t){return isW(t)&&t.date>=ds(a)&&t.date<=ds(addDays(a,6))}))};
  var cw=W(w0),pv=0;for(var i=1;i<=4;i++)pv+=W(addDays(w0,-7*i));pv/=4;
  if(cw>500&&pv>0&&cw>pv*1.3)A.push({l:'',t:'Non-essential spending this week is '+dg(Math.round((cw/pv-1)*100))+'% above your recent weekly average.'});
  var tot=sum(mt),wt=sum(mt.filter(isW));
  if(tot>0&&mt.length>=5&&wt/tot>.35)A.push({l:'',t:dg(Math.round(wt/tot*100))+'% of this month’s spending is non-essential.'});
  var inc=sum(S.tx.filter(function(t){return t.type==='inc'&&t.date.slice(0,7)===mk}));
  if(inc>0&&tot>inc)A.push({l:'r2',t:'You have spent more than you earned this month.'});
  return A}
function alertsH(){var a=alerts();return a.length?'<div class="h">Alerts</div>'+a.map(function(x){return '<div class="al '+x.l+'">⚠️ '+esc(x.t)+'</div>'}).join(''):''}

/* overview */
function home(){
  var k=ds(mon).slice(0,7);
  var mt=S.tx.filter(function(t){return t.date.slice(0,7)===k}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
  var ex=mt.filter(function(t){return t.type==='exp'}),te=sum(ex),ti=sum(mt.filter(function(t){return t.type==='inc'}));
  var by={};ex.forEach(function(t){by[t.cat]=(by[t.cat]||0)+B(t)});
  var cats=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  var bal=ti-te;
  var h='<div class="nav"><button data-a="pm" aria-label="Previous month">‹</button><b>'+dg(mon.toLocaleDateString('en-US',{month:'long',year:'numeric'}))+'</b><button data-a="nm" aria-label="Next month">›</button></div><h1>Overview</h1>';
  h+=seg('cur',[['BDT','৳ BDT'],['USD','$ USD']],S.cur,'','cur');
  h+='<div class="g hero"><div class="mut">Spent this month</div><div class="big">'+fb(te)+'</div><div class="two" style="margin:0"><div style="padding:0"><small>Income</small><b class="gr">'+fb(ti)+'</b></div><div style="padding:0"><small>Balance</small><b class="'+(bal<0?'rd':'')+'">'+(bal<0?'−':'')+fb(Math.abs(bal))+'</b></div></div></div>';
  h+=alertsH();
  if(cats.length){h+='<div class="h">By category</div><div class="g">'+cats.map(function(c){
    var b=+S.bud[c]||0,r=b?by[c]/b:by[c]/te,cl=b&&r>=1?'over':b&&r>=.8?'warn':'';
    return '<div class="r col"><div class="rr"><span>'+(EM[c]||'📦')+' '+esc(c)+(S.wants.indexOf(c)>-1?'<small class="tag">non-essential</small>':'')+'</span><b>'+fb(by[c])+'</b></div><div class="pb '+cl+'"><i style="width:'+Math.min(100,r*100)+'%"></i></div>'+(b?'<small>of '+fb(b)+' budget</small>':'')+'</div>'}).join('')+'</div>'}
  if(!mt.length)return h+'<div class="empty">Nothing here yet.<br>Tap + to add an expense or income.</div>';
  var d='',open=false;
  mt.forEach(function(t){
    if(t.date!==d){d=t.date;if(open)h+='</div>';open=true;
      var dt=sum(mt.filter(function(x){return x.date===d&&x.type==='exp'}));
      h+='<div class="h">'+dg(pd(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}))+(dt?' · '+fb(dt):'')+'</div><div class="g">'}
    var inc=t.type==='inc';
    h+='<button class="r" data-a="tx" data-v="'+t.id+'"><span class="ic">'+(inc?'💰':EM[t.cat]||'📦')+'</span><span class="mid"><b>'+esc(t.note||t.cat)+'</b><small>'+esc(t.cat)+(t.pay?' · '+esc(t.pay):'')+'</small></span><span class="amt2 '+(inc?'gr':'')+'">'+(inc?'+':'−')+fb(B(t))+(t.cur!==S.cur?'<small>'+fm(t.amt,t.cur)+'</small>':'')+'</span></button>'});
  return h+'</div>'}

/* weekly review + trend */
function week(){
  var a=wk,A=ds(a),Z=ds(addDays(a,6)),pa=ds(addDays(a,-7)),pb=ds(addDays(a,-1));
  var ex=S.tx.filter(function(t){return t.type==='exp'});
  var cw=ex.filter(function(t){return t.date>=A&&t.date<=Z}),pw=ex.filter(function(t){return t.date>=pa&&t.date<=pb});
  var tc=sum(cw),tp=sum(pw),dn=['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];
  var days=[0,1,2,3,4,5,6].map(function(i){var d=ds(addDays(a,i));return sum(cw.filter(function(t){return t.date===d}))});
  var mx=Math.max.apply(null,days.concat([1])),pk=days.indexOf(Math.max.apply(null,days));
  var bc={},pc={};cw.forEach(function(t){bc[t.cat]=(bc[t.cat]||0)+B(t)});pw.forEach(function(t){pc[t.cat]=(pc[t.cat]||0)+B(t)});
  var cats=Object.keys(bc).sort(function(x,y){return bc[y]-bc[x]});
  var ww=sum(cw.filter(function(t){return S.wants.indexOf(t.cat)>-1}));
  var I=[];
  if(!cw.length)I.push('No expenses recorded this week.');
  else{
    I.push('You spent <b>'+fb(tc)+'</b>'+(tp?', '+dg(Math.abs(Math.round((tc/tp-1)*100)))+'% '+(tc>=tp?'more':'less')+' than last week':'')+'.');
    I.push('Biggest category: <b>'+esc(cats[0])+'</b> ('+fb(bc[cats[0]])+', '+dg(Math.round(bc[cats[0]]/tc*100))+'%).');
    var big=cw.reduce(function(m,t){return B(t)>B(m)?t:m});
    I.push('Largest single expense: '+esc(big.note||big.cat)+', '+fb(B(big))+'.');
    I.push('Busiest day: '+dn[pk]+'.');
    if(ww>0)I.push('Non-essential spending: '+fb(ww)+' ('+dg(Math.round(ww/tc*100))+'%).'+(ww/tc>.3?' Cutting it by a fifth would save about '+fb(ww*.2)+' a week.':''))}
  var h='<div class="nav"><button data-a="pw" aria-label="Previous week">‹</button><b>'+fd(A)+' – '+fd(Z)+'</b><button data-a="nw" aria-label="Next week">›</button></div><h1>Weekly review</h1>';
  h+=seg('cur',[['BDT','৳ BDT'],['USD','$ USD']],S.cur,'','cur');
  h+='<div class="g hero"><div class="mut">Spent this week</div><div class="big">'+fb(tc)+'</div><small>Last week: '+fb(tp)+'. Weeks run Saturday to Friday.</small></div>';
  h+='<div class="h">Daily spending</div><div class="g"><div class="bars">'+days.map(function(v,i){return '<div class="'+(i===pk&&v>0?'pk':'')+'"><i style="height:'+(v/mx*78)+'px"></i><small>'+dn[i]+'</small></div>'}).join('')+'</div></div>';
  h+='<div class="h">Your week in short</div><div class="g ins">'+I.map(function(x){return '<p>'+x+'</p>'}).join('')+'</div>';
  if(cats.length)h+='<div class="h">Versus last week</div><div class="g">'+cats.map(function(c){
    var p=pc[c],dl=p?Math.round((bc[c]/p-1)*100):null;
    return '<div class="r"><span class="ic">'+(EM[c]||'📦')+'</span><span class="mid"><b>'+esc(c)+'</b><small>'+(dl===null?'New this week':(dl>=0?'Up ':'Down ')+dg(Math.abs(dl))+'%')+'</small></span><b>'+fb(bc[c])+'</b></div>'}).join('')+'</div>';
  h+=alertsH();
  /* 6-month trend */
  var now=new Date(),ms=[];
  for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1),k=ds(d).slice(0,7);
    ms.push({l:dg(d.toLocaleDateString('en-US',{month:'short'})),e:sum(ex.filter(function(t){return t.date.slice(0,7)===k})),i:sum(S.tx.filter(function(t){return t.type==='inc'&&t.date.slice(0,7)===k}))})}
  var m2=Math.max.apply(null,ms.map(function(x){return Math.max(x.e,x.i)}).concat([1]));
  var svg='<svg viewBox="0 0 300 130" width="100%" role="img" aria-label="Six month spending and income trend">'+ms.map(function(x,i){var he=x.e/m2*96,hi=x.i/m2*96,ox=i*50+8;
    return '<rect class="be" x="'+ox+'" y="'+(104-he)+'" width="15" height="'+he+'" rx="3"/><rect class="bi" x="'+(ox+17)+'" y="'+(104-hi)+'" width="15" height="'+hi+'" rx="3"/><text x="'+(ox+16)+'" y="122" text-anchor="middle">'+x.l+'</text>'}).join('')+'</svg>';
  var prev=(ms[2].e+ms[3].e+ms[4].e)/3,cur=ms[5].e,tr=prev>0?Math.round((cur/prev-1)*100):null;
  h+='<div class="h">Six month trend</div><div class="g" style="padding:14px">'+svg+'<small><span class="rd" style="color:var(--blue)">■</span> Spent &nbsp;<span style="color:var(--grn)">■</span> Income</small>'+(tr!==null?'<p style="margin:8px 0 0;font-size:14px">This month is '+dg(Math.abs(tr))+'% '+(tr>=0?'above':'below')+' your average of the previous three months.</p>':'')+'</div>';
  return h}

/* money */
var rem=function(l){return l.amt-(l.pays||[]).reduce(function(s,p){return s+p.amt},0)};
var xb=function(o,v){return o.cur==='USD'?v*S.rate:v};
function money(){
  var h='<div class="top"><h1>Money</h1><button class="lnk" data-a="'+(lt==='loans'?'addloan':'addinv')+'">Add</button></div>';
  h+=seg('lt',[['loans','Loans'],['inv','Investments']],lt,'','lt');
  if(lt==='loans'){
    var ow=0,od=0;S.loans.forEach(function(l){var r=xb(l,rem(l));if(r>0){if(l.dir==='lent')ow+=r;else od+=r}});
    h+='<div class="two"><div><small>Owed to you</small><b class="gr">'+fb(ow)+'</b></div><div><small>You owe</small><b class="rd">'+fb(od)+'</b></div></div>';
    if(!S.loans.length)return h+'<div class="empty">No loans yet.<br>Track money you lent or borrowed, with due dates and part payments.</div>';
    var L=S.loans.slice().sort(function(a,b){return (rem(a)<=0)-(rem(b)<=0)||((a.due||'9')<(b.due||'9')?-1:1)});
    h+='<div class="g" style="margin-top:12px">'+L.map(function(l){var r=rem(l),done=r<=0,late=!done&&l.due&&l.due<tdy(),pc=Math.min(100,(l.amt-r)/l.amt*100);
      return '<button class="r col" data-a="loan" data-v="'+l.id+'"><div class="rr"><span><b>'+(l.dir==='lent'?'🤝 ':'📥 ')+esc(l.who)+'</b></span><b>'+(done?'Settled':fb(xb(l,r)))+'</b></div><div class="pb"><i style="width:'+pc+'%;background:var(--grn)"></i></div><small class="'+(late?'rd':'')+'">'+(l.dir==='lent'?'Owes you':'You owe')+' · '+(late?'Overdue, was due ':l.due?'due ':'')+(l.due?fd(l.due):'no due date')+'</small></button>'}).join('')+'</div>';
    return h}
  var pt=0,vt=0;S.inv.forEach(function(i){pt+=xb(i,i.put);vt+=xb(i,i.val)});var gl=vt-pt;
  h+='<div class="two"><div><small>Invested</small><b>'+fb(pt)+'</b></div><div><small>Current value</small><b>'+fb(vt)+'</b></div></div><div class="g hero" style="padding:12px 14px"><small>Total gain or loss</small><div style="font-size:22px;font-weight:700" class="'+(gl>=0?'gr':'rd')+'">'+(gl>=0?'+':'−')+fb(Math.abs(gl))+(pt?' ('+dg(Math.abs(Math.round(gl/pt*1000)/10))+'%)':'')+'</div></div>';
  if(!S.inv.length)return h+'<div class="empty">No investments yet.<br>Add DPS, FDR, Sanchayapatra, stocks, gold or crypto.</div>';
  return h+'<div class="g">'+S.inv.map(function(i){var g=i.val-i.put;
    return '<button class="r" data-a="inv" data-v="'+i.id+'"><span class="ic">📈</span><span class="mid"><b>'+esc(i.name)+'</b><small>'+esc(i.kind)+' · in '+fm(i.put,i.cur)+'</small></span><span class="amt2">'+fm(i.val,i.cur)+'<small class="'+(g>=0?'gr':'rd')+'">'+(g>=0?'+':'−')+dg(Math.abs(Math.round(g/i.put*1000)/10))+'%</small></span></button>'}).join('')+'</div>'}

/* settings */
function set(){
  return '<h1>Settings</h1><div class="g"><div class="r"><span>1 USD in ৳</span><input class="in" id="s_rate" inputmode="decimal" value="'+S.rate+'" data-ch="rate" aria-label="Exchange rate"></div><div class="r"><span style="flex:1">Bangla digits (০১২৩)</span><input type="checkbox" class="sw" data-ch="bn" '+(S.bn?'checked':'')+' aria-label="Bangla digits"></div></div>'+
  '<div class="h">Non-essential categories and monthly budgets (৳)</div><div class="g">'+EC.map(function(c){return '<div class="r"><span style="flex:1;min-width:0">'+EM[c]+' '+esc(c)+'</span><input type="checkbox" class="sw" data-ch="want" data-v="'+esc(c)+'" '+(S.wants.indexOf(c)>-1?'checked':'')+' aria-label="'+esc(c)+' non-essential"><input class="in bud" inputmode="decimal" placeholder="Budget" data-ch="bud" data-v="'+esc(c)+'" value="'+(S.bud[c]||'')+'" aria-label="'+esc(c)+' budget"></div>'}).join('')+'</div>'+
  '<p class="note">Switch on a category to mark it non-essential. Alerts warn you when these grow fast. A budget in ৳ triggers warnings at 80% and 100%.</p>'+
  '<div class="h">Your data</div><div class="g"><button class="r" data-a="csv">Export CSV</button><button class="r" data-a="bak">Back up</button><button class="r" data-a="res">Restore backup</button></div><input type="file" id="imf" accept=".json,application/json" hidden>'+
  '<p class="note">All data stays on this iPhone. Back up regularly, and restore from the file if you ever clear Safari data.</p>'}

function render(){
  var v={home:home,week:week,money:money,set:set}[tab]();
  $('app').innerHTML=v;
  document.querySelectorAll('.ti [data-tab]').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)})}

/* transaction sheet */
function openTx(id){
  var t=id?S.tx.filter(function(x){return x.id===id})[0]:null;
  F=t?Object.assign({},t,{amt:String(t.amt)}):{id:0,type:'exp',amt:'',cur:S.cur,cat:EC[0],pay:'Cash',note:'',date:tdy()};
  if(!t&&ds(mon).slice(0,7)!==tdy().slice(0,7))F.date=ds(mon);
  SF=txS;txS()}
function txS(){
  var inc=F.type==='inc',cs=inc?IC:EC;if(cs.indexOf(F.cat)<0)F.cat=cs[0];
  sheet('<h3>'+(F.id?'Edit':'New')+' transaction</h3>'+seg('type',[['exp','Expense'],['inc','Income']],F.type)+
  '<div class="g amt"><input id="f_amt" inputmode="decimal" placeholder="0" value="'+esc(F.amt)+'" aria-label="Amount">'+seg('cur',[['BDT','৳'],['USD','$']],F.cur,'s')+'</div>'+
  '<div class="h">Category</div><div class="chips">'+cs.map(function(c){return chip('cat',c,F.cat,(EM[c]||'💰')+' '+c)}).join('')+'</div>'+
  (inc?'':'<div class="h">Paid with</div><div class="chips">'+PAY.map(function(c){return chip('pay',c,F.pay)}).join('')+'</div>')+
  '<div class="g" style="margin-top:12px"><input class="in" id="f_note" placeholder="Note" maxlength="80" value="'+esc(F.note)+'" aria-label="Note"><div class="r"><span>Date</span><input class="in" id="f_date" type="date" value="'+F.date+'"></div></div>'+
  '<div class="btns">'+(F.id?'<button class="b d" data-a="deltx">Delete</button>':'')+'<button class="b" data-a="x">Cancel</button><button class="b p" data-a="savetx">Save</button></div>')}
function saveTx(){
  rd();var a=num(F.amt);if(!(a>0)){toast('Enter an amount above zero.');return}
  var r={id:F.id||Date.now(),type:F.type,amt:Math.round(a*100)/100,cur:F.cur,cat:F.cat,note:(F.note||'').trim(),date:F.date||tdy()};
  if(F.type==='exp')r.pay=F.pay;
  S.tx=F.id?S.tx.map(function(x){return x.id===F.id?r:x}):S.tx.concat([r]);
  save();var d=pd(r.date);mon=new Date(d.getFullYear(),d.getMonth(),1);closeS();render();toast(F.id?'Changes saved':'Saved')}

/* loan sheet */
function openLoan(id){
  var l=id?S.loans.filter(function(x){return x.id===id})[0]:null;
  F=l?Object.assign({},l,{amt:String(l.amt),pays:(l.pays||[]).slice()}):{id:0,dir:'lent',who:'',amt:'',cur:S.cur,date:tdy(),due:'',note:'',pays:[]};
  SF=loanS;loanS()}
function loanS(){
  var ps=F.pays||[],paid=ps.reduce(function(s,p){return s+p.amt},0);
  sheet('<h3>'+(F.id?'Edit loan':'New loan')+'</h3>'+seg('dir',[['lent','I lent'],['borrowed','I borrowed']],F.dir)+
  '<div class="g"><input class="in" id="f_who" placeholder="Person’s name" value="'+esc(F.who)+'" aria-label="Person"></div>'+
  '<div class="g amt"><input id="f_amt" inputmode="decimal" placeholder="0" value="'+esc(F.amt)+'" aria-label="Amount">'+seg('cur',[['BDT','৳'],['USD','$']],F.cur,'s')+'</div>'+
  '<div class="g"><div class="r"><span>Date</span><input class="in" id="f_date" type="date" value="'+F.date+'"></div><div class="r"><span>Due date</span><input class="in" id="f_due" type="date" value="'+(F.due||'')+'"></div><input class="in" id="f_note" placeholder="Note" maxlength="80" value="'+esc(F.note)+'" aria-label="Note"></div>'+
  (F.id?'<div class="h">Payments · '+fm(paid,F.cur)+' of '+fm(num(F.amt)||0,F.cur)+'</div><div class="g">'+ps.map(function(p){return '<div class="r"><span style="flex:1">'+fd(p.date)+'</span><b>'+fm(p.amt,F.cur)+'</b></div>'}).join('')+'<div class="r"><input class="in" id="f_pay" inputmode="decimal" placeholder="Payment amount" style="text-align:left" aria-label="Payment amount"><button class="lnk" data-a="addpay" style="padding:0">Record</button></div></div>':'')+
  '<div class="btns">'+(F.id?'<button class="b d" data-a="delloan">Delete</button>':'')+'<button class="b" data-a="x">Cancel</button><button class="b p" data-a="saveloan">Save</button></div>')}
function saveLoan(keep){
  rd();var a=num(F.amt);if(!(a>0)){toast('Enter the loan amount.');return false}
  if(!(F.who||'').trim()){toast('Enter a name.');return false}
  var r={id:F.id||Date.now(),dir:F.dir,who:F.who.trim(),amt:a,cur:F.cur,date:F.date||tdy(),due:F.due||'',note:(F.note||'').trim(),pays:F.pays||[]};
  S.loans=F.id?S.loans.map(function(x){return x.id===F.id?r:x}):S.loans.concat([r]);F.id=r.id;
  save();if(!keep){closeS();render();toast('Saved')}return true}

/* investment sheet */
function openInv(id){
  var i=id?S.inv.filter(function(x){return x.id===id})[0]:null;
  F=i?Object.assign({},i,{put:String(i.put),val:String(i.val)}):{id:0,name:'',kind:IK[0],put:'',val:'',cur:S.cur,date:tdy()};
  SF=invS;invS()}
function invS(){
  sheet('<h3>'+(F.id?'Edit investment':'New investment')+'</h3><div class="g"><input class="in" id="f_name" placeholder="Name (e.g. City Bank DPS)" value="'+esc(F.name)+'" aria-label="Name"></div>'+
  '<div class="chips">'+IK.map(function(k){return chip('kind',k,F.kind)}).join('')+'</div>'+seg('cur',[['BDT','৳ BDT'],['USD','$ USD']],F.cur)+
  '<div class="g"><div class="r"><span>Amount invested</span><input class="in" id="f_put" inputmode="decimal" placeholder="0" value="'+esc(F.put)+'"></div><div class="r"><span>Current value</span><input class="in" id="f_val" inputmode="decimal" placeholder="Same as invested" value="'+esc(F.val)+'"></div><div class="r"><span>Start date</span><input class="in" id="f_date" type="date" value="'+F.date+'"></div></div>'+
  '<div class="btns">'+(F.id?'<button class="b d" data-a="delinv">Delete</button>':'')+'<button class="b" data-a="x">Cancel</button><button class="b p" data-a="saveinv">Save</button></div>')}
function saveInv(){
  rd();var p=num(F.put);if(!(p>0)||!(F.name||'').trim()){toast('Enter a name and the amount invested.');return}
  var v=num(F.val);if(!(v>=0))v=p;
  var r={id:F.id||Date.now(),name:F.name.trim(),kind:F.kind,put:p,val:v,cur:F.cur,date:F.date||tdy()};
  S.inv=F.id?S.inv.map(function(x){return x.id===F.id?r:x}):S.inv.concat([r]);save();closeS();render();toast('Saved')}

function del(k){if(!confirm('Delete this?'))return;var m={tx:'tx',loan:'loans',inv:'inv'}[k];S[m]=S[m].filter(function(x){return x.id!==F.id});save();closeS();render()}

/* export / import */
function out(name,text,type){
  var blob=new Blob([text],{type:type}),file;try{file=new File([blob],name,{type:type})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(){});return}
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
function csv(){
  var R=[['date','type','amount','currency','category','paid_with','note','amount_bdt']];
  S.tx.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(t){R.push([t.date,t.type,t.amt,t.cur,t.cat,t.pay||'',t.note,B(t).toFixed(2)])});
  out('spend-'+tdy()+'.csv',R.map(function(r){return r.map(function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\n'),'text/csv')}
function restore(f){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.tx))throw 0;
  if(!confirm('Replace everything on this phone with the backup ('+o.tx.length+' transactions)?'))return;Object.assign(S,o);save();render();toast('Backup restored')}catch(e){toast('That is not a valid backup file.')}};r.readAsText(f)}

/* events */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case 'tab':tab=v;render();scrollTo(0,0);break;
    case 'pm':mon=new Date(mon.getFullYear(),mon.getMonth()-1,1);render();break;
    case 'nm':mon=new Date(mon.getFullYear(),mon.getMonth()+1,1);render();break;
    case 'pw':wk=addDays(wk,-7);render();break;
    case 'nw':wk=addDays(wk,7);render();break;
    case 'cur':S.cur=v;save();render();break;
    case 'lt':lt=v;render();break;
    case 'add':openTx();break;
    case 'tx':openTx(+v);break;
    case 'addloan':openLoan();break;
    case 'loan':openLoan(+v);break;
    case 'addinv':openInv();break;
    case 'inv':openInv(+v);break;
    case 'seg':case 'chip':rd();F[el.dataset.g]=v;SF();break;
    case 'savetx':saveTx();break;
    case 'saveloan':saveLoan();break;
    case 'saveinv':saveInv();break;
    case 'deltx':del('tx');break;
    case 'delloan':del('loan');break;
    case 'delinv':del('inv');break;
    case 'addpay':rd();var p=num(F.pay);if(!(p>0)){toast('Enter a payment amount.');break}
      F.pays=(F.pays||[]).concat([{amt:p,date:tdy()}]);F.pay='';if(saveLoan(true)){loanS();render();toast('Payment recorded')}break;
    case 'csv':csv();break;
    case 'bak':out('spend-backup-'+tdy()+'.json',JSON.stringify(S),'application/json');break;
    case 'res':$('imf').click();break;
    case 'x':closeS();break;
  }});
document.addEventListener('change',function(ev){
  var t=ev.target,c=t.dataset.ch;
  if(t.id==='imf'){if(t.files[0])restore(t.files[0]);t.value='';return}
  if(!c)return;
  if(c==='rate'){var n=num(t.value);if(n>0){S.rate=n;save();toast('Rate updated')}else{t.value=S.rate;toast('Enter a rate above zero.')}}
  else if(c==='bn'){S.bn=t.checked;save();render()}
  else if(c==='want'){var v=t.dataset.v,i=S.wants.indexOf(v);if(t.checked&&i<0)S.wants.push(v);if(!t.checked&&i>-1)S.wants.splice(i,1);save()}
  else if(c==='bud'){var b=num(t.value);if(b>0)S.bud[t.dataset.v]=b;else delete S.bud[t.dataset.v];save()}});

load();
var n0=new Date();mon=new Date(n0.getFullYear(),n0.getMonth(),1);wk=ws(n0);
render();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
})();
</script>
</body>
</html>
